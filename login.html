<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Git Basic Lab</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #111827, #4f46e5);
            color: white;
        }

        .card {
            width: 380px;
            padding: 35px;
            border-radius: 20px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(15px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #cbd5e1;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: none;
            border-radius: 10px;
            outline: none;
            background: white;
            color: #111827;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #6366f1;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #818cf8;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            color: #86efac;
            display: none;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>Welcome Back</h1>

        <p class="subtitle">
            Git Basic Lab - Form Login
        </p>

        <form id="loginForm">

            <label for="user">Username</label>
            <input
                type="text"
                id="user"
                name="user"
                placeholder="Masukkan username"
                required
            >

            <label for="pass">Password</label>
            <input
                type="password"
                id="pass"
                name="pass"
                placeholder="Masukkan password"
                required
            >

            <button type="submit">Login</button>

        </form>

        <div id="message">
            Login berhasil!
        </div>
    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", function(event) {
            event.preventDefault();

            document.getElementById("message").style.display = "block";
        });
    </script>

</body>
</html>
